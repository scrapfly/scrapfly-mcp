name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Check formatting
        run: test -z "$(gofmt -l pkg/mcpskills pkg/server)"
      - name: Check dependencies
        run: go mod tidy -diff
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test the skills sync
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests
